<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoonDeck Backup Server</title>
<style>
:root{color-scheme:dark;--purple:#9b6bff;--ink:#f4f0e6;--muted:#a6a2ae;--line:#34313c;--card:#1c1a22;--field:#15131a;--green:#a3e635;--red:#ff8f85;font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#121016,#1a1721);color:var(--ink)}
header{height:76px;background:var(--purple);display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:16px}
.brand{display:flex;align-items:baseline;gap:16px;min-width:0}.logo{font-size:40px;letter-spacing:-1px;color:#fff;white-space:nowrap}.logo b{font-weight:800;color:#0b0a0e}.logo span{font-weight:300}.brand h1{font-size:24px;font-weight:600;color:#fff;margin:0}
button,input,select{font:inherit;color:inherit}
button{appearance:none;border:0;border-radius:10px;padding:12px 20px;background:#2a2930;font-weight:700;cursor:pointer;min-height:44px}button:hover{background:#38363f}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--purple);color:#fff}button.primary:hover{background:#8a58f0}button.danger{color:var(--red)}button.ghost{background:rgba(11,10,14,.28);color:#fff}button.ghost:hover{background:rgba(11,10,14,.4)}
.shell{display:flex;min-height:calc(100vh - 76px)}nav{width:260px;flex:none;padding:24px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
nav .item{text-align:left;padding:15px 20px;border-radius:12px;font-size:17px;font-weight:600;color:#cfcbd6;background:none}nav .item:hover{background:#25232b}nav .item[aria-current=page]{background:var(--purple);color:#fff}
.grow{flex:1}.activity{padding:0 6px 12px;display:grid;gap:6px}.caption{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8d8996}.activity p{margin:0}.activity .state{font-size:13px;color:#8d8996;margin-top:6px}
.foot{padding:14px 20px;font-size:13px;color:var(--muted)}
main{flex:1;min-width:0;padding:32px 40px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--purple);margin:0}.help{font-size:15px;color:var(--muted);margin:8px 0 0}.help.sm{font-size:14px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 30px;display:grid;gap:18px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:44px}.col{display:grid;gap:22px;align-content:start}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:grid;gap:8px;font-size:16px;color:var(--muted)}label.check{display:flex;align-items:center;gap:14px;font-size:17px;color:var(--ink)}
input,select{height:52px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:0 18px;font-size:17px;width:100%}input:focus,select:focus,button:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
input[type=checkbox]{appearance:none;width:22px;height:22px;padding:0;border-radius:6px;border:2px solid #55525e;background:none;display:grid;place-items:center;flex:none}input[type=checkbox]:checked{background:var(--purple);border-color:var(--purple)}input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.device-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}.device-top h2{margin:0;font-size:22px}.state{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:#6f6b78}.on .dot{background:var(--green)}.on{color:var(--green)}.bad{color:var(--red)}.bad .dot{background:var(--red)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.points{border:1px solid var(--line);border-radius:12px;overflow:hidden}.point{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;background:var(--field);flex-wrap:wrap}.point+.point{border-top:1px solid var(--line)}.point b{font-size:16px}.point small{display:block;color:var(--muted);font-size:13px;margin-top:3px}.point .actions button{padding:9px 14px;min-height:38px}
details summary{cursor:pointer;color:var(--muted);font-size:15px;padding:4px 0}
.modal{position:fixed;inset:0;background:rgba(8,7,10,.74);display:grid;place-items:center;z-index:10;padding:20px}.dialog{width:min(620px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px;display:grid;gap:18px;justify-items:center;text-align:center}
.code{font:700 clamp(26px,5vw,44px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;white-space:nowrap;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:18px 28px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2a2930;border:1px solid var(--line);border-radius:12px;padding:14px 22px;font-weight:600;z-index:20;max-width:90vw}.toast.ok{border-color:var(--green)}.toast.err{border-color:var(--red)}
#login{max-width:520px;margin:64px auto;padding:0 20px}
[hidden]{display:none!important}
@media(max-width:900px){nav{width:auto;flex-direction:row;border:0;padding:12px 16px;overflow:auto;border-bottom:1px solid var(--line)}.shell{flex-direction:column}.two{grid-template-columns:1fr;gap:26px}main{padding:22px 16px}.activity,.foot,.grow{display:none}header{padding:0 16px}.logo{font-size:30px}.brand h1{font-size:18px}}
</style>
<header><div class="brand"><span class="logo"><span>roon</span><b>Deck</b></span><h1>Backup Server</h1></div><button class="ghost" id="logout" hidden>Sign out</button></header>
<section id="login"><div class="card"><p class="eyebrow">SIGN IN</p><p class="help" style="margin:0">Use the server password from your container configuration.</p><label>Server password<input id="password" type="password" autocomplete="current-password"></label><div><button class="primary" id="signin">Sign in</button></div></div></section>
<div class="shell" id="app" hidden>
<nav aria-label="Backup Server"><button class="item" data-page="devices">Devices</button><button class="item" data-page="policy">Policy</button><button class="item" data-page="pairing">Pairing</button><div class="grow"></div>
<div class="activity" id="savebar" hidden><span class="caption">Activity</span><p id="activity">Ready</p><p class="state" id="savestate">All changes saved</p><button class="primary" id="save" disabled>Save changes</button></div><div class="foot" id="summary"></div></nav>
<main id="page"></main></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem('rd-token')||'',snapshot=null,page='devices',policyDraft=null,dirty=false,pairing=null,timers=[];
const POINT_LABELS={streamdeck:'Stream Deck designs',home_layout:'Home layout'};
async function api(path,data){const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const v=await r.json().catch(()=>({}));if(r.status===401){signOut(true);throw Error('Sign in again')}if(!r.ok)throw Error(v.error||'Request failed');return v}
function el(tag,attrs,...kids){const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')n.className=v;else if(k.startsWith('on'))n[k]=v;else if(v!==false&&v!==null&&v!==undefined)n.setAttribute(k,v===true?'':v)}n.append(...kids.flat().filter(x=>x!==null&&x!==undefined&&x!==false));return n}
function toast(text,kind){const t=$('toast');t.textContent=text;t.className='toast '+(kind||'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,kind==='err'?7000:3500)}
const btn=(text,fn,cls)=>{const b=el('button',{type:'button',class:cls||''},text);b.onclick=async()=>{b.disabled=true;try{await fn(b)}catch(e){toast(e.message,'err')}finally{b.disabled=false}};return b};
const when=t=>t?new Date(t*1000).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'Never';
function describe(c,encrypted){if(!c)return encrypted?'Settings · credentials (encrypted)':'Settings';const parts=['Settings'];if(c.streamdeck)parts.push('Stream Deck designs');if(c.home_layout)parts.push('Home layout');if(c.images)parts.push(c.images+(c.images===1?' image':' images'));if(c.credentials)parts.push('credentials (encrypted)');return parts.join(' · ')}
function size(b){return b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB'}
function signOut(silent){token='';sessionStorage.removeItem('rd-token');timers.forEach(clearInterval);timers=[];$('app').hidden=true;$('login').hidden=false;$('logout').hidden=true;if(!silent)location.reload()}
function mark(v){dirty=v;$('save').disabled=!v;$('savestate').textContent=v?'Unsaved changes — Policy':'All changes saved'}
function go(next){if(dirty&&!confirm('Leave without saving your policy changes?'))return;page=next;mark(false);policyDraft=null;draw()}
function draw(){document.querySelectorAll('nav .item').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));$('savebar').hidden=page!=='policy';const m=$('page');m.replaceChildren();({devices:drawDevices,policy:drawPolicy,pairing:drawPairing})[page](m);
const d=snapshot.devices,n=d.reduce((s,x)=>s+x.backups.length,0),bytes=d.reduce((s,x)=>s+x.backups.reduce((a,b)=>a+b.size,0),0);$('summary').replaceChildren('Backup Server',el('br'),d.length+(d.length===1?' device':' devices')+' · '+n+(n===1?' recovery point':' recovery points')+' · '+size(bytes))}
async function load(){snapshot=await api('admin/status');$('login').hidden=true;$('app').hidden=false;$('logout').hidden=false}
async function refresh(){if(dirty||pairing)return;try{await load();if(page!=='policy')draw()}catch(_){}}

function devicePolicyForm(d){const p={...d.policy};const f={};const box=el('div',{class:'two'});box.append(policyColumns(p,f));const save=btn('Save for this device',async()=>{await api('admin/policy',{device:d.device,policy:readPolicy(p,f)});toast('Saved for '+d.name,'ok');await load();draw()},'primary');return el('div',{class:'col'},box,el('div',{class:'actions'},save,btn('Use the server policy',async()=>{await api('admin/use-defaults',{device:d.device});toast(d.name+' follows the server policy','ok');await load();draw()})))}
function deviceCard(d){const online=!d.revoked&&Date.now()/1000-d.last_seen<120;const status=d.revoked?['Access revoked','bad']:online?['Online','on']:['Offline',''];
const state=el('span',{class:'state '+status[1]},el('span',{class:'dot'}),status[0]);
const run=btn('Back up now',async b=>{const before=d.last_success;await api('admin/run',{device:d.device});b.textContent='Waiting for '+d.name+'…';for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,3000));await load();const x=snapshot.devices.find(z=>z.device===d.device);if(x&&x.last_success>before){draw();toast('Backed up '+d.name,'ok');return}if(x&&x.error){draw();throw Error(x.error)}}draw();toast(d.name+' has not picked up the request yet. It checks in every 30 seconds.','err')},'primary');
if(d.revoked)run.disabled=true;
const top=el('div',{class:'device-top'},el('div',{},el('h2',{},d.name),el('p',{class:'help'},'Last backup '+when(d.last_success)+(d.policy.enabled?' · daily at '+d.policy.time:' · automatic backups paused'))),el('div',{class:'actions'},state,run,btn('Replace this Pi',()=>openPairing(d.device,d.name))));
const points=el('div',{class:'points'});
if(!d.backups.length)points.append(el('div',{class:'point'},el('span',{class:'help',style:'margin:0'},'No recovery points yet. Press Back up now.')));
for(const b of [...d.backups].sort((x,y)=>y.created-x.created)){points.append(el('div',{class:'point',title:describe(b.contents,b.encrypted)},el('div',{},el('b',{},when(b.created)),el('small',{},describe(b.contents,b.encrypted)+' · '+size(b.size)+(b.app_version?' · v'+b.app_version:''))),el('div',{class:'actions'},btn('Download',()=>download(d,b)),btn('Delete',async()=>{if(!confirm('Permanently delete this recovery point?'))return;await api('admin/delete',{device:d.device,name:b.name});await load();draw()},'danger'))))}
const own=Object.keys(d.policy).length&&JSON.stringify(d.policy)!==JSON.stringify(snapshot.policy);
const more=el('details',{},el('summary',{},'Device options'+(own?' · has its own policy':'')),el('div',{class:'col',style:'margin-top:16px'},devicePolicyForm(d),el('div',{class:'actions'},btn(d.revoked?'Access revoked':'Revoke this device’s access',async()=>{if(!confirm('Revoke this device’s access? Its recovery points are kept.'))return;await api('admin/revoke',{device:d.device});await load();draw()},'danger'))));
return el('section',{class:'card'},top,el('p',{class:'eyebrow'},'RECOVERY POINTS'),points,more)}
function drawDevices(m){const list=snapshot.devices;m.append(el('div',{class:'head'},el('div',{},el('p',{class:'eyebrow'},'DEVICES'),el('p',{class:'help'},'Each paired RoonDeck keeps its own recovery points. Older ones are removed automatically.')),btn('Pair a device',()=>openPairing(),'primary')));
if(!list.length)m.append(el('section',{class:'card'},el('b',{},'No devices yet'),el('p',{class:'help',style:'margin:0'},'Press Pair a device, then enter the code on your Pi under Software › Backup Server.')));
for(const d of list)m.append(deviceCard(d))}
async function download(d,b){const bundle=await api('admin/download',{device:d.device,name:b.name});const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(bundle)],{type:'application/json'})),download:b.name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

function policyColumns(p,f){const field=(k,label,type,extra={})=>{const i=el('input',{type,...extra});if(type==='checkbox')i.checked=!!p[k];else i.value=p[k];i.oninput=i.onchange=()=>{if(f.onchange)f.onchange()};f[k]=i;return i};
const row=(k,text)=>el('label',{class:'check'},field(k,text,'checkbox'),text);
const col1=el('div',{class:'col'},el('p',{class:'eyebrow'},'SCHEDULE'),row('enabled','Back up every day'),el('div',{class:'pair'},el('label',{},'Time',field('time','Time','time')),el('label',{},'Timezone',field('timezone','Timezone','text',{placeholder:'Asia/Singapore'}))),row('on_change','Also back up shortly after changes'),el('p',{class:'help sm',style:'margin:-8px 0 0'},'Off by default, so you get one recovery point a day.'));
const col2=el('div',{class:'col'},el('p',{class:'eyebrow'},'KEEP'),el('div',{class:'pair'},el('label',{},'Newest recovery points',field('keep','Keep','number',{min:1,max:365})),el('label',{},'Delete older than (days)',field('max_age_days','Days','number',{min:0,max:3650,placeholder:'0 = never'}))),el('p',{class:'help sm',style:'margin:-8px 0 0'},'Older recovery points are removed automatically after every backup.'),el('p',{class:'eyebrow'},'CREDENTIALS'),row('include_secrets','Encrypt and include passwords and tokens'),el('p',{class:'help sm',style:'margin:-8px 0 0'},'Needs a recovery password set on each Pi. The server cannot decrypt it.'));
const frag=document.createDocumentFragment();frag.append(col1,col2);return frag}
function readPolicy(p,f){const out={};for(const[k,i]of Object.entries(f)){if(k==='onchange')continue;out[k]=i.type==='checkbox'?i.checked:i.type==='number'?Number(i.value||0):i.value.trim()}out.change_delay_seconds=p.change_delay_seconds;return out}
function drawPolicy(m){const p={...snapshot.policy},f={};f.onchange=()=>mark(true);
m.append(el('div',{},el('p',{class:'eyebrow'},'POLICY'),el('p',{class:'help'},'Applies to every device unless a device has its own. The newest recovery point is always kept.')));
const card=el('section',{class:'card two'});card.append(policyColumns(p,f));m.append(card);
$('save').onclick=async()=>{const b=$('save');b.disabled=true;$('activity').textContent='Saving…';try{await api('admin/policy',{policy:readPolicy(p,f)});await load();mark(false);$('activity').textContent='Saved';toast('Policy saved. Devices pick it up automatically.','ok')}catch(e){$('activity').textContent='Ready';b.disabled=false;toast(e.message,'err')}}}

function drawPairing(m){m.append(el('div',{},el('p',{class:'eyebrow'},'PAIRING'),el('p',{class:'help'},'Connect a RoonDeck to this server in three steps.')),
el('section',{class:'card'},el('ol',{style:'margin:0;padding-left:22px;display:grid;gap:12px;font-size:17px'},el('li',{},'Press Pair a device to get a one-time code.'),el('li',{},'On the Pi open Software › Backup Server and enter this server’s address, a name and the code.'),el('li',{},'Press Pair. This page shows the device as soon as it connects.')),el('div',{class:'actions'},btn('Pair a device',()=>openPairing(),'primary'))),
el('section',{class:'card'},el('p',{class:'eyebrow'},'REPLACING A PI'),el('p',{class:'help',style:'margin:0'},'Open the device on the Devices page and press Replace this Pi. The new Pi pairs with a recovery code and takes over the existing recovery points; the old Pi’s access is revoked.')))}
async function openPairing(device,name){const started=Date.now()/1000;const result=await api('admin/pair-code',{device:device||''});const code=result.code.match(/.{1,4}/g).join(' ');const left=el('div',{class:'help',style:'margin:0'});const dlg=el('div',{class:'dialog',role:'dialog','aria-modal':'true'},el('p',{class:'eyebrow'},device?'REPLACE '+name.toUpperCase():'PAIR A DEVICE'),el('p',{class:'help',style:'margin:0'},device?'On the new Pi open Software › Backup Server and enter this recovery code.':'On the Pi open Software › Backup Server and enter this code.'),el('div',{class:'code'},code),left,el('div',{class:'state on'},el('span',{class:'dot'}),'Waiting for the Pi…'),el('div',{class:'actions'},btn('Cancel',()=>close())));
const wrap=el('div',{class:'modal'},dlg);document.body.append(wrap);const end=Date.now()+result.expires_in*1000;
const close=()=>{clearInterval(pairing);pairing=null;wrap.remove()};
pairing=setInterval(async()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));left.textContent='Expires in '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' · single use';if(!s){close();toast('The code expired. Press Pair a device for a new one.','err');return}
try{snapshot=await api('admin/status');const hit=snapshot.devices.find(d=>d.paired_at>=started&&(!device||d.device===device));if(hit){close();toast(hit.name+' paired. Its first backup starts shortly.','ok');draw()}}catch(_){}},2000)}

document.querySelectorAll('nav .item').forEach(b=>b.onclick=()=>go(b.dataset.page));
$('signin').onclick=async()=>{token=$('password').value;try{await load();sessionStorage.setItem('rd-token',token);$('password').value='';draw();timers.push(setInterval(refresh,15000))}catch(e){token='';toast(e.message,'err')}};
$('password').onkeydown=e=>{if(e.key==='Enter')$('signin').click()};$('logout').onclick=()=>signOut();
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if(token)load().then(()=>{draw();timers.push(setInterval(refresh,15000))}).catch(()=>signOut(true));
</script></html>
