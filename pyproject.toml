[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roon-deck"
version = "1.1.3-beta.48"
description = "RoonDeck, an independent Raspberry Pi touchscreen for Roon"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
roon-deck = "pi_bus_time_display.server:main"
pi-home = "pi_bus_time_display.server:main"
pi-bus-time-display = "pi_bus_time_display.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_bus_time_display = ["static/*", "static/brand/*"]
