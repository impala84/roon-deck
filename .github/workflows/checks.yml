name: Baseline checks
on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # tools/check selects Python 3.13 first; install test dependencies there.
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: roon-controller/package-lock.json
      - name: Install image test dependency
        run: python3.13 -m pip install 'Pillow>=10,<13'
      - run: tools/check fast
