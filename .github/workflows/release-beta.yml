name: Publish beta release

# Publishes the GitHub prerelease for the newest "## X.Y.Z-beta.N Alpine" entry in CHANGELOG.md once a commit that
# changes the changelog lands on main. It is what tools/release-beta does at the end, without needing a local checkout.
# A Pi on the Beta channel installs published prereleases; pushing code alone never changes a Pi.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          heading = re.compile(r"^## (\d+\.\d+\.\d+-beta\.(\d+)) Alpine — .+$", re.M)
          matches = list(heading.finditer(text))
          if not matches or re.search(r"^## ", text, re.M).start() != matches[0].start():
              print("No beta release at the top of CHANGELOG.md."); sys.exit(0)
          first = matches[0]
          next_heading = re.search(r"^## ", text[first.end():], re.M)
          end = first.end() + next_heading.start() if next_heading else len(text)
          version, notes = first.group(1), text[first.start():end].strip()
          tag = "v" + version
          exists = subprocess.run(["gh", "release", "view", tag], capture_output=True).returncode == 0
          if exists:
              print(f"{tag} is already published."); sys.exit(0)
          # The version files must already carry this version (they are bumped in the same commit).
          for path, pattern in (("pyproject.toml", 'version = "%s"'), ("src/pi_bus_time_display/__init__.py", '__version__ = "%s"')):
              if pattern % version not in open(path, encoding="utf-8").read():
                  sys.exit(f"{path} is not at {version}; not releasing.")
          open("notes.md", "w", encoding="utf-8").write(notes)
          subprocess.run(["gh", "release", "create", tag, "--target", os.environ["GITHUB_SHA"], "--prerelease",
                          "--title", f"{version} Alpine", "--notes-file", "notes.md"], check=True)
          print(f"Published {tag}.")
          PY
